[project]
name = "frankenstein"
version = "0.1.0"
description = "A self-building agent: notices missing capabilities, builds, tests and installs them."
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk",
    "fastapi",
    "uvicorn",
    "pyyaml",
]

[project.scripts]
frank = "harness.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness", "ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]

[tool.ruff]
line-length = 140
