[project]
name = "frankenstein"
version = "0.1.0"
description = "A self-building agent: notices missing capabilities, builds, tests and installs them."
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk",
    "fastapi",
    "uvicorn",
    "pyyaml",
    "python-telegram-bot>=22.8",
    "elevenlabs>=2.71.0",
    "discord-py>=2.4",
]

[project.scripts]
frank = "harness.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness", "ui", "channels"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
asyncio_mode = "strict"

[tool.ruff]
line-length = 140
